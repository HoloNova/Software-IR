name: verify

# The heavy verification this repository needs runs here, not on the development
# machine: the local box has 2 vCPU and ~3 GB of memory, which is not enough for a
# ten-module reactor plus a real MySQL and a generated Spring Boot application.
#
# What this workflow produces, in one job so the Maven repository stays coherent:
#   1. online build/provider priming with JUnit dry-run, never acceptance evidence
#   2. the authoritative frozen full gate: mvn -o clean verify
#   3. only after a frozen-gate failure: a completion pass to collect remaining diagnostics
#      (the frozen failure still fails the job; its original reports are kept separately)
#   4. the query, write and relation business ITs against real MySQL 8.4
#   5. the R5 independent verification IT: real Maven build, real application, real MySQL, separate
#      static/build/start/business results for a correct sample, a static-valid wrong sample, a candidate
#      that does not compile and an unreachable database; and the project (SIR 0.2) chain: a command edit is
#      verified for real and published to a Git working tree, a candidate that breaks the requirement is stopped
#      before anything changes
#
# Artifacts: every conformance evidence directory and the surefire reports, so the
# evidence can be tied to this commit SHA and this run URL.

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates-and-business-it:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kcg-ci-root
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pkcg-ci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    env:
      # The conformance harness derives the schema-scoped runtime URL from this endpoint
      # plus the validated schema name, so the control URL must not select a schema.
      # These are throwaway CI-only credentials for a container that dies with the job.
      KCG_CONF_CONTROL_JDBC_URL: jdbc:mysql://127.0.0.1:33306/
      KCG_CONF_CONTROL_USERNAME: kcg_conf_control
      KCG_CONF_CONTROL_PASSWORD: kcg-ci-control
      KCG_CONF_RUNTIME_USERNAME: kcg_conf_runtime
      KCG_CONF_RUNTIME_PASSWORD: kcg-ci-runtime
      KCG_CONF_SCHEMA_NAME: kcg_conf_run
      # Job-level env only allows the github/inputs/matrix/needs/secrets/strategy/vars
      # contexts, so these live under the workspace rather than runner.temp.
      KCG_CONF_WORK_PARENT: ${{ github.workspace }}/ci-work
      KCG_CONF_EVIDENCE_PARENT: ${{ github.workspace }}/ci-evidence
      MAVEN_REPO: ${{ github.workspace }}/.m2-ci
      MAVEN_OPTS: -Xmx1g

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the frozen Maven repository
        uses: actions/cache@v4
        with:
          path: ${{ env.MAVEN_REPO }}
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Provision the control and runtime credentials
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -P 33306 -uroot -pkcg-ci-root <<'SQL'
          -- The run schema itself is NOT created here: the conformance harness owns the
          -- schema lifecycle (CREATE ... DROP) and refuses a schema it did not create.
          CREATE USER IF NOT EXISTS 'kcg_conf_control'@'%' IDENTIFIED BY 'kcg-ci-control';
          GRANT ALL PRIVILEGES ON *.* TO 'kcg_conf_control'@'%' WITH GRANT OPTION;
          CREATE USER IF NOT EXISTS 'kcg_conf_runtime'@'%' IDENTIFIED BY 'kcg-ci-runtime';
          GRANT SELECT, INSERT, UPDATE, DELETE ON `kcg_conf_run`.* TO 'kcg_conf_runtime'@'%';
          FLUSH PRIVILEGES;
          SQL
          mkdir -p "$KCG_CONF_WORK_PARENT" "$KCG_CONF_EVIDENCE_PARENT"
          mysql -h 127.0.0.1 -P 33306 -uroot -pkcg-ci-root -N -B -e "SELECT VERSION(), @@server_uuid"

      # The repository starts empty on a fresh runner: the offline gates cannot run until the
      # reactor's plugins and dependencies are present, and the generated project's own
      # dependencies (spring-boot-starter-parent, mybatis-plus, mysql-connector-j) are not in
      # the reactor's closure at all. Discover tests to resolve the dynamic Surefire provider,
      # but do not execute test bodies three times. Dry-run is NOT a passing verification gate.
      - name: Prime reactor build and test providers (online, dry-run)
        run: |
          set -euo pipefail
          mvn -B clean verify -Dmaven.test.failure.ignore=true \
            -Djunit.platform.execution.dryRun.enabled=true -Dmaven.repo.local="$MAVEN_REPO"

      - name: Prime the generated project dependencies (one online IT)
        run: |
          set -euo pipefail
          mvn -B -pl sir-toolchain-application -am \
            -Dmaven.repo.local="$MAVEN_REPO" \
            -Dtest=QuerySliceBusinessConformanceIT -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -Dkcg.query-conformance.enabled=true -Dkcg.query-conformance.maven-offline=false \
            -Dkcg.conformance.work-parent="$KCG_CONF_WORK_PARENT" \
            -Dkcg.conformance.evidence-parent="$KCG_CONF_EVIDENCE_PARENT" \
            -Dkcg.conformance.maven-executable="$(command -v mvn)" \
            -Dkcg.conformance.maven-repo="$MAVEN_REPO" \
            test

      - name: Frozen full gate
        id: frozen
        run: |
          set -euo pipefail
          mvn -B -o clean verify -Djunit.platform.execution.dryRun.enabled=false -Dmaven.repo.local="$MAVEN_REPO"

      # The diagnostic pass cleans targets, so preserve the first failure before it overwrites reports.
      - name: Upload original frozen-gate failure reports
        if: failure() && steps.frozen.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: frozen-failure-surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn

      - name: Completion diagnostics (only after frozen-gate failure)
        if: failure() && steps.frozen.outcome == 'failure'
        run: |
          set -euo pipefail
          mvn -B -o clean verify -Dmaven.test.failure.ignore=true \
            -Djunit.platform.execution.dryRun.enabled=false -Dmaven.repo.local="$MAVEN_REPO"

      - name: Business conformance ITs
        run: |
          set -euo pipefail
          mvn -B -o -pl sir-toolchain-application -am \
            -Dmaven.repo.local="$MAVEN_REPO" \
            -Dtest=QuerySliceBusinessConformanceIT,WriteSliceBusinessConformanceIT,RelationSliceBusinessConformanceIT,GuardedTransitionBusinessConformanceIT,TokenDeskBusinessConformanceIT,BearerCredentialBusinessConformanceIT,DualTokenBusinessConformanceIT,CrudAccessBusinessConformanceIT,MoneyBusinessConformanceIT,MultiplicationBusinessConformanceIT \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -Dkcg.query-conformance.enabled=true \
            -Dkcg.write-conformance.enabled=true \
            -Dkcg.relation-conformance.enabled=true \
            -Dkcg.guard-conformance.enabled=true \
            -Dkcg.token-conformance.enabled=true \
            -Dkcg.bearer-conformance.enabled=true \
            -Dkcg.dual-token-conformance.enabled=true \
            -Dkcg.crud-conformance.enabled=true \
            -Dkcg.money-conformance.enabled=true \
            -Dkcg.multiplication-conformance.enabled=true \
            -Dkcg.conformance.work-parent="$KCG_CONF_WORK_PARENT" \
            -Dkcg.conformance.evidence-parent="$KCG_CONF_EVIDENCE_PARENT" \
            -Dkcg.conformance.maven-executable="$(command -v mvn)" \
            -Dkcg.conformance.maven-repo="$MAVEN_REPO" \
            test

      - name: Independent verification IT
        run: |
          set -euo pipefail
          mvn -B -o -pl sir-toolchain-application -am \
            -Dmaven.repo.local="$MAVEN_REPO" \
            -Dtest=IndependentVerificationIT,ProjectVerificationChainIT \
            -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -Dkcg.verification.enabled=true \
            -Dkcg.conformance.work-parent="$KCG_CONF_WORK_PARENT" \
            -Dkcg.conformance.evidence-parent="$KCG_CONF_EVIDENCE_PARENT" \
            -Dkcg.conformance.maven-executable="$(command -v mvn)" \
            -Dkcg.conformance.maven-repo="$MAVEN_REPO" \
            test

      # The runnable jar must start with nothing but the JDK: every sir-* module and antlr4-runtime are
      # inside it. A class missing from the jar shows up here as NoClassDefFoundError, which no test that
      # runs on the reactor's own classpath can show. It sits after the business evidence so that a failure
      # here cannot hide the results above. The jar comes from the frozen gate's `clean verify`; the
      # steps in between do not clean.
      - name: Standalone CLI smoke
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/kcg-cli/target/kcg.jar"
          SOURCE="$GITHUB_WORKSPACE/kcg-cli/src/test/resources/io/kcg/cli/multi-course"
          OUTPUT="$RUNNER_TEMP/standalone-smoke-generated"
          test -f "$JAR"
          java -jar "$JAR" --help
          # Results go to files first: with pipefail, `grep -q` quitting early would kill the writer.
          java -jar "$JAR" inspect --source-root "$SOURCE" --entry project.sir > "$RUNNER_TEMP/standalone-smoke-inspect.json"
          grep -q '"outcome":"INSPECTED"' "$RUNNER_TEMP/standalone-smoke-inspect.json"
          java -jar "$JAR" generate --source-root "$SOURCE" --entry project.sir --output-root "$OUTPUT" > "$RUNNER_TEMP/standalone-smoke-generate.json"
          grep -q '"outcome":"GENERATED"' "$RUNNER_TEMP/standalone-smoke-generate.json"
          test -f "$OUTPUT/pom.xml"

      - name: Upload standalone CLI for the delivery gate
        uses: actions/upload-artifact@v4
        with:
          name: standalone-cli
          path: kcg-cli/target/kcg.jar
          if-no-files-found: error

      - name: Upload conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-evidence
          path: ${{ env.KCG_CONF_EVIDENCE_PARENT }}
          # A dot-prefixed directory would be treated as hidden and skipped by default.
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn

  standalone-deployment:
    needs: gates-and-business-it
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: standalone-cli
          path: ${{ runner.temp }}/delivery-cli
      - name: Deployment smoke lifecycle regression
        run: python3 -m unittest discover -s .github/scripts -p test_deployment_smoke.py -v
      - name: Export a standalone delivery with the public CLI
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/deployment-evidence"
          java -Xmx256m -jar "$RUNNER_TEMP/delivery-cli/kcg.jar" package \
            --source-root "$GITHUB_WORKSPACE/sir-toolchain-application/src/test/resources/deployment/dual-token" \
            --entry project.sir --output-root "$RUNNER_TEMP/backend-delivery" \
            --acceptance "$GITHUB_WORKSPACE/sir-toolchain-application/src/test/resources/deployment/dual-token-acceptance" \
            > "$RUNNER_TEMP/deployment-evidence/export.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["outcome"] == "PACKAGE_EXPORTED"' "$RUNNER_TEMP/deployment-evidence/export.json"
          # The same software with one more comment line: different package bytes, same schema (schema-unchanged update).
          cp -R "$GITHUB_WORKSPACE/sir-toolchain-application/src/test/resources/deployment/dual-token" "$RUNNER_TEMP/dual-token-next"
          printf '\n// next delivery: same schema\n' >> "$RUNNER_TEMP/dual-token-next/project.sir"
          java -Xmx256m -jar "$RUNNER_TEMP/delivery-cli/kcg.jar" package \
            --source-root "$RUNNER_TEMP/dual-token-next" --entry project.sir --output-root "$RUNNER_TEMP/backend-delivery-next" \
            --acceptance "$GITHUB_WORKSPACE/sir-toolchain-application/src/test/resources/deployment/dual-token-acceptance" \
            > "$RUNNER_TEMP/deployment-evidence/export-next.json"
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["outcome"] == "PACKAGE_EXPORTED"' "$RUNNER_TEMP/deployment-evidence/export-next.json"
          # Version 2 continues the chain of the package the instance will run: Note.text renamed to body under its
          # declared identity, the default of Note.pinned changed, a new table, a new nullable column and a new required
          # column with a default.
          java -Xmx256m -jar "$RUNNER_TEMP/delivery-cli/kcg.jar" package \
            --source-root "$GITHUB_WORKSPACE/sir-toolchain-application/src/test/resources/deployment/dual-token-v2" \
            --entry project.sir --output-root "$RUNNER_TEMP/backend-delivery-v2" --base-package "$RUNNER_TEMP/backend-delivery-next" \
            > "$RUNNER_TEMP/deployment-evidence/export-v2.json"
          python3 -c 'import json,sys; d = json.load(open(sys.argv[1])); assert d["outcome"] == "PACKAGE_EXPORTED" and d["schemaVersion"] == 6 and [x["step"] for x in d["steps"]] == ["V2 RENAME_COLUMN note.text -> body", "V3 CHANGE_COLUMN_DEFAULT note.pinned", "V4 CREATE_TABLE label", "V5 ADD_NULLABLE_COLUMN note.title", "V6 ADD_DEFAULTED_COLUMN note.state"], d' "$RUNNER_TEMP/deployment-evidence/export-v2.json"
          # Going back to version 1 on top of version 2 would drop data: without a confirmed backup the public CLI refuses
          # it and writes nothing.
          STATUS=0
          java -Xmx256m -jar "$RUNNER_TEMP/delivery-cli/kcg.jar" package \
            --source-root "$GITHUB_WORKSPACE/sir-toolchain-application/src/test/resources/deployment/dual-token" \
            --entry project.sir --output-root "$RUNNER_TEMP/backend-delivery-back" --base-package "$RUNNER_TEMP/backend-delivery-v2" \
            > "$RUNNER_TEMP/deployment-evidence/export-refused.json" || STATUS=$?
          test "$STATUS" -eq 3 && test ! -e "$RUNNER_TEMP/backend-delivery-back"
          grep -q 'SIR-DEPLOY-UPDATE-BACKUP-001' "$RUNNER_TEMP/deployment-evidence/export-refused.json"
          # Version 3 widens a column and drops a column and a table. Refused until the backup is confirmed; then exported
          # with the dropped data named.
          STATUS=0
          java -Xmx256m -jar "$RUNNER_TEMP/delivery-cli/kcg.jar" package \
            --source-root "$GITHUB_WORKSPACE/sir-toolchain-application/src/test/resources/deployment/dual-token-v3" \
            --entry project.sir --output-root "$RUNNER_TEMP/backend-delivery-v3" --base-package "$RUNNER_TEMP/backend-delivery-v2" \
            > "$RUNNER_TEMP/deployment-evidence/export-v3-refused.json" || STATUS=$?
          test "$STATUS" -eq 3 && test ! -e "$RUNNER_TEMP/backend-delivery-v3"
          grep -q 'SIR-DEPLOY-UPDATE-BACKUP-001' "$RUNNER_TEMP/deployment-evidence/export-v3-refused.json"
          java -Xmx256m -jar "$RUNNER_TEMP/delivery-cli/kcg.jar" package \
            --source-root "$GITHUB_WORKSPACE/sir-toolchain-application/src/test/resources/deployment/dual-token-v3" \
            --entry project.sir --output-root "$RUNNER_TEMP/backend-delivery-v3" --base-package "$RUNNER_TEMP/backend-delivery-v2" \
            --confirm-backup yes > "$RUNNER_TEMP/deployment-evidence/export-v3.json"
          python3 -c 'import json,sys; d = json.load(open(sys.argv[1])); assert d["outcome"] == "PACKAGE_EXPORTED" and d["schemaVersion"] == 11 and [x["step"] for x in d["steps"]] == ["V7 WIDEN_COLUMN note.state", "V8 CREATE_TABLE favorite", "V9 ADD_DEFAULTED_COLUMN user.favorites", "V10 DROP_COLUMN note.title", "V11 DROP_TABLE label"] and d["dataLoss"] == ["note.title", "label"], d' "$RUNNER_TEMP/deployment-evidence/export-v3.json"
          tar -czf "$RUNNER_TEMP/backend-delivery.tar.gz" -C "$RUNNER_TEMP/backend-delivery" .
      - name: Cold deployment, actual HTTP and persistence acceptance
        run: |
          set -euo pipefail
          python3 .github/scripts/deployment-smoke.py \
            --package "$RUNNER_TEMP/backend-delivery" \
            --next-package "$RUNNER_TEMP/backend-delivery-next" \
            --v2-package "$RUNNER_TEMP/backend-delivery-v2" \
            --v3-package "$RUNNER_TEMP/backend-delivery-v3" \
            --state "$RUNNER_TEMP/deployment state" \
            --evidence "$RUNNER_TEMP/deployment-evidence" \
            --instance "kcg-delivery-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --port 18080
      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-evidence
          path: ${{ runner.temp }}/deployment-evidence
          if-no-files-found: warn
      - name: Upload standalone source delivery (never runtime secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-source-delivery
          path: ${{ runner.temp }}/backend-delivery.tar.gz
          if-no-files-found: warn
