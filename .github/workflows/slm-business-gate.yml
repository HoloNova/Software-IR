name: slm-business-gate

# Judges one frozen teacher candidate with the business IT of its problem, on demand only.
# The IT, its DDL, seed and HTTP/JDBC checks are the same ones verify.yml runs against the reference answer;
# BusinessSliceHarness swaps in the candidate when the kcg.slm.* properties are set and refuses a candidate
# whose task froze a different reference answer. The bundle and its sample must be committed on the ref
# this workflow runs on. The job is green only when the candidate's business gate PASSED; the evidence
# (slm-runtime.json, report, logs) and the surefire reports are uploaded either way.

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'Bundle directory, e.g. datasets/sir/runs/dual-token-gate-v1'
        required: true
        type: string
      sample_id:
        description: 'Sample id under <bundle>/samples/'
        required: true
        type: string
      it:
        description: 'Business IT of the problem'
        required: true
        type: choice
        options:
          - DualTokenBusinessConformanceIT
          - BearerCredentialBusinessConformanceIT
          - CourseSelectionBusinessConformanceIT
          - BlogBusinessConformanceIT
          - CrudAccessBusinessConformanceIT
          - GuardedTransitionBusinessConformanceIT
          - LibraryBorrowingBusinessConformanceIT
          - MoneyBusinessConformanceIT
          - MultiplicationBusinessConformanceIT
          - QuerySliceBusinessConformanceIT
          - RelationSliceBusinessConformanceIT
          - TokenDeskBusinessConformanceIT
          - WriteSliceBusinessConformanceIT

# Each run has its own runner and MySQL container, so different samples judge in parallel; only
# re-dispatching the same sample waits. A group per ref kept a single pending run and cancelled the rest.
concurrency:
  group: slm-business-gate-${{ inputs.sample_id }}
  cancel-in-progress: false

jobs:
  judge-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: kcg-ci-root
        ports:
          - 33306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pkcg-ci-root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30

    env:
      # Same throwaway CI-only reference environment as verify.yml.
      KCG_CONF_CONTROL_JDBC_URL: jdbc:mysql://127.0.0.1:33306/
      KCG_CONF_CONTROL_USERNAME: kcg_conf_control
      KCG_CONF_CONTROL_PASSWORD: kcg-ci-control
      KCG_CONF_RUNTIME_USERNAME: kcg_conf_runtime
      KCG_CONF_RUNTIME_PASSWORD: kcg-ci-runtime
      KCG_CONF_SCHEMA_NAME: kcg_conf_run
      KCG_CONF_WORK_PARENT: ${{ github.workspace }}/ci-work
      KCG_CONF_EVIDENCE_PARENT: ${{ github.workspace }}/ci-evidence
      MAVEN_REPO: ${{ github.workspace }}/.m2-ci
      MAVEN_OPTS: -Xmx1g
      # Inputs reach the scripts only as environment variables, never spliced into the script text.
      GATE_BUNDLE: ${{ inputs.bundle }}
      GATE_SAMPLE: ${{ inputs.sample_id }}
      GATE_IT: ${{ inputs.it }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the inputs name a committed bundle and sample
        run: |
          set -euo pipefail
          [[ "$GATE_BUNDLE" =~ ^datasets/sir/[A-Za-z0-9._/-]+$ && "$GATE_BUNDLE" != *..* ]] \
            || { echo "bundle must be a path under datasets/sir/"; exit 1; }
          [[ "$GATE_SAMPLE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,159}$ ]] || { echo "invalid sample id"; exit 1; }
          test -f "$GATE_BUNDLE/manifest.json"
          test -f "$GATE_BUNDLE/samples/$GATE_SAMPLE/candidate.sir"
          test -f "$GATE_BUNDLE/samples/$GATE_SAMPLE/candidate.json"
          # Each IT is switched on by its own property; the harness reads the candidate through all of them.
          case "$GATE_IT" in
            DualTokenBusinessConformanceIT) p=dual-token ;;
            BearerCredentialBusinessConformanceIT) p=bearer ;;
            CourseSelectionBusinessConformanceIT) p=course ;;
            BlogBusinessConformanceIT) p=blog ;;
            CrudAccessBusinessConformanceIT) p=crud ;;
            GuardedTransitionBusinessConformanceIT) p=guard ;;
            LibraryBorrowingBusinessConformanceIT) p=library ;;
            MoneyBusinessConformanceIT) p=money ;;
            MultiplicationBusinessConformanceIT) p=multiplication ;;
            QuerySliceBusinessConformanceIT) p=query ;;
            RelationSliceBusinessConformanceIT) p=relation ;;
            TokenDeskBusinessConformanceIT) p=token ;;
            WriteSliceBusinessConformanceIT) p=write ;;
            *) echo "unknown IT"; exit 1 ;;
          esac
          echo "GATE_ENABLED=kcg.$p-conformance.enabled" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Reuse what verify.yml cached on main; this workflow never writes the cache.
      - name: Restore the Maven repository
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.MAVEN_REPO }}
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Provision the control and runtime credentials
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -P 33306 -uroot -pkcg-ci-root <<'SQL'
          CREATE USER IF NOT EXISTS 'kcg_conf_control'@'%' IDENTIFIED BY 'kcg-ci-control';
          GRANT ALL PRIVILEGES ON *.* TO 'kcg_conf_control'@'%' WITH GRANT OPTION;
          CREATE USER IF NOT EXISTS 'kcg_conf_runtime'@'%' IDENTIFIED BY 'kcg-ci-runtime';
          GRANT SELECT, INSERT, UPDATE, DELETE ON `kcg_conf_run`.* TO 'kcg_conf_runtime'@'%';
          FLUSH PRIVILEGES;
          SQL
          mkdir -p "$KCG_CONF_WORK_PARENT" "$KCG_CONF_EVIDENCE_PARENT"

      # Online, so a missing or stale cache only costs downloads. A failed business check fails this step;
      # an IT that only reports NOT_RUN does not, so the summary below also requires business PASSED.
      - name: Judge the candidate with the business IT
        run: |
          set -euo pipefail
          mvn -B -pl sir-toolchain-application -am \
            -Dmaven.repo.local="$MAVEN_REPO" \
            -Dtest="$GATE_IT" -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false \
            -D"$GATE_ENABLED"=true \
            -Dkcg.query-conformance.maven-offline=false \
            -Dkcg.conformance.work-parent="$KCG_CONF_WORK_PARENT" \
            -Dkcg.conformance.evidence-parent="$KCG_CONF_EVIDENCE_PARENT" \
            -Dkcg.conformance.maven-executable="$(command -v mvn)" \
            -Dkcg.conformance.maven-repo="$MAVEN_REPO" \
            -Dkcg.slm.repo-root="$GITHUB_WORKSPACE" \
            -Dkcg.slm.bundle-root="$GITHUB_WORKSPACE/$GATE_BUNDLE" \
            -Dkcg.slm.candidate-root="$GITHUB_WORKSPACE/$GATE_BUNDLE/samples/$GATE_SAMPLE" \
            test

      - name: Summarize the candidate evidence
        if: always()
        run: |
          set -euo pipefail
          mapfile -t found < <(find "$KCG_CONF_EVIDENCE_PARENT" -name slm-runtime.json 2>/dev/null)
          {
            echo "### $GATE_SAMPLE on $GATE_IT"
            echo "commit: $GITHUB_SHA"
            if [ "${#found[@]}" -ne 1 ]; then
              echo "slm-runtime.json files found: ${#found[@]} (expected 1) - no candidate verdict"
            else
              python3 -c 'import json,sys; e=json.load(open(sys.argv[1])); print("gates:", json.dumps(e["gates"], sort_keys=True)); print("generated_digest:", e["generated_digest"])' "${found[0]}"
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          test "${#found[@]}" -eq 1
          python3 -c 'import json,sys; sys.exit(json.load(open(sys.argv[1]))["gates"]["business"] != "PASSED")' "${found[0]}"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slm-gate-${{ inputs.sample_id }}
          path: ${{ env.KCG_CONF_EVIDENCE_PARENT }}
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slm-gate-surefire-${{ inputs.sample_id }}
          path: '**/target/surefire-reports/**'
          if-no-files-found: warn
